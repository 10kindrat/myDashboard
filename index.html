<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>개인대쉬보드</title>
	<style>
		body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans KR',"Helvetica Neue",Arial;margin:0;background:#f5f7fa;color:#111}
		header{background:#2b6cb0;color:#fff;padding:20px 24px}
		.container{max-width:1100px;margin:24px auto;padding:0 16px}
		.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
		.card{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 4px rgba(16,24,40,.06)}
		footer{text-align:center;color:#666;padding:24px 0;font-size:13px}
	</style>
</head>
<body>
	<header>
		<h1 style="margin:0;font-size:20px">개인대쉬보드</h1>
	</header>
	<main class="container">
		<section class="grid">
			<div class="card">
				<h2 style="margin:0 0 8px 0;font-size:16px">오늘의 일정</h2>
				<p style="margin:0;color:#444">일정이 없습니다.</p>
			</div>
			<div class="card">
				<h2 style="margin:0 0 8px 0;font-size:16px">메모</h2>
				<p style="margin:0;color:#444">새 메모를 추가하세요.</p>
			</div>
			<div class="card", onclick="clicked()">
				<h2 style="margin:0 0 8px 0;font-size:16px">할일</h2>
				<ul style="margin:0;padding-left:18px;color:#444">
					<li>할 일을 추가하세요</li>
				</ul>
			</div>
			<div class="card">
				<h2 style="margin:0 0 8px 0;font-size:16px">날씨</h2>
				<p style="margin:0;color:#444">지역을 설정하세요.</p>
			</div>
		</section>
	</main>
	<footer>
		개인대쉬보드 — 간단한 시작 템플릿
	</footer>

    <script src="script.js"></script>
</body>
</html>
