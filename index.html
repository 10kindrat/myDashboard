<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>개인대쉬보드</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
	<header>
		<h1 style="margin:0;font-size:20px">개인대쉬보드</h1>
	</header>
	<main class="container">
		<section class="grid">
			<div class="card">
				<h2>오늘의 일정</h2>
				<p>일정이 없습니다.</p>
			</div>
			<div class="card">
				<h2>메모</h2>
				<p>새 메모를 추가하세요.</p>
			</div>
			<div class="card">
				<h2>할일</h2>
				<ul id="todoList">
				</ul>
				<button onclick="clickTodo()">할일 추가</button>
			</div>
			<div class="clock">
				<div id="clock"></div>
				<div class="hand hour" id="hour"></div>
				<div class="hand minute" id="minute"></div>
				<div class="hand second" id="second"></div>
				<div class="center"></div>	
			</div>
		</section>

		
	</main>
	<footer>
		개인대쉬보드 — 간단한 시작 템플릿
	</footer>

    <script src="js/script.js"></script>
</body>
</html>
